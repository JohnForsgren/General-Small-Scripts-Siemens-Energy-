<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Productivity Manager Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Settings</p>
        <h1>Focus Productivity Manager</h1>
        <p class="lede">Tune the YouTube rules locally. Nothing leaves the browser.</p>
      </section>

      <section class="card">
        <label><input id="enabled" type="checkbox" /> Enable focus mode</label>
        <label><input id="hideHomeFeed" type="checkbox" /> Hide YouTube home feed</label>
        <label><input id="hideWatchSidebar" type="checkbox" /> Hide watch-page recommendations</label>
        <label><input id="hideEndScreenCards" type="checkbox" /> Hide end-screen cards and overlays</label>
        <label><input id="hideShortsShelf" type="checkbox" /> Hide Shorts shelves</label>
        <label><input id="hideComments" type="checkbox" /> Hide comments</label>
      </section>

      <section class="card actions">
        <button id="save" type="button">Save settings</button>
        <button id="reset" type="button" class="secondary">Reset defaults</button>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
