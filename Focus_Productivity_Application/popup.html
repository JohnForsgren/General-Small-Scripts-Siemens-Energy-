<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Productivity Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <p class="eyebrow">YouTube focus mode</p>
        <h1>Focus Productivity Manager</h1>
        <p class="subtitle">Hide distracting YouTube surfaces while keeping search usable.</p>
      </header>

      <label class="toggle-row">
        <span>Enable focus mode</span>
        <input id="enabled" type="checkbox" />
      </label>

      <div class="buttons">
        <button id="openOptions" type="button">Open settings</button>
        <button id="reset" type="button" class="secondary">Reset defaults</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
