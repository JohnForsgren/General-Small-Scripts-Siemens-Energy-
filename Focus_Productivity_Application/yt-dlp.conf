# Download audio as MP3 with embedded JPG cover art
--extract-audio
--audio-format mp3
--embed-thumbnail
--convert-thumbnails jpg

# Download complete playlists; continue past unavailable items
--yes-playlist
--ignore-errors

# Save MP3 files in the ambient sounds folder
--paths "C:\YT-DLP\AMBIENT_SOUNDS"
--output "%(title)s [%(id)s].%(ext)s"
